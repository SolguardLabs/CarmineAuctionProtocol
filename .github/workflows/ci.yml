name: CI

on:
  push:
  pull_request:

jobs:
  python-vyper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: bash scripts/ci.sh

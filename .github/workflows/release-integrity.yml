name: Release Integrity

on:
    push:
        tags:
            - "v*"
    release:
        types:
            - published

permissions:
    contents: read

concurrency:
    group: release-integrity-${{ github.event.release.tag_name || github.ref_name }}
    cancel-in-progress: false

jobs:
    integrity:
        name: Production tag integrity
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Resolve release tag
              id: release
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  REF_TAG: ${{ github.ref_name }}
              run: |
                  tag="${RELEASE_TAG:-$REF_TAG}"
                  if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Invalid production tag: $tag" >&2
                    exit 1
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Checkout tagged source
              uses: actions/checkout@v7
              with:
                  ref: ${{ steps.release.outputs.tag }}
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: requirements-dev.txt

            - name: Install dependencies
              run: python -m pip install -r requirements-dev.txt

            - name: Verify immutable production reference
              shell: bash
              env:
                  TAG: ${{ steps.release.outputs.tag }}
              run: |
                  git fetch origin main production "refs/tags/$TAG:refs/tags/$TAG" --force
                  test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
                  tagged="$(git rev-parse "refs/tags/$TAG^{}")"
                  main="$(git rev-parse origin/main)"
                  production="$(git rev-parse origin/production)"
                  test "$tagged" = "$main"
                  test "$tagged" = "$production"
                  test "$TAG" = "v1.0.0"

            - name: Re-run quality gate
              run: python scripts/ci.py

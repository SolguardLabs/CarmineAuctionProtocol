[project]
name = "carmine-auction-protocol"
version = "1.0.0"
description = "Infraestructura de subastas de liquidacion con contratos Vyper y SDK Python"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "tests/private",
    "tests/test_carmine_auction_protocol.py",
    "scripts/generate_risk_tables.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
